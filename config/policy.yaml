# policy.yaml — État du droit codé, lu par l'agent Conformité
# Seule source de vérité. Toute modification incrémente `version` et est journalisée.
# Chaque entrée porte : valeur, statut (fait | hypothese | choix_equipe), sources (chunk_id), lacune liée.
# Usage « et si » : un régulateur peut modifier une valeur (ex. decret_transfert_publie: true)
# et rejouer les scénarios pour voir l'effet sur le système (voir spec 007, FR-707).

version: "1.3.0"   # 1.3.0 : numéros d'urgence, validation clinique du triage, seuils de surveillance confirmés, contestation 7 jours
# 1.2.0   # 1.2.0 : art. 19 relu (autorisation préalable de tout traitement) ; art. 66 al. 1 (et non 65) pour le consentement exprès ; position du juriste sur art. 48/66
# 1.1.0 : art. 48 relu sur le texte officiel ; santé = sensible (art. 5)
date_effet: "2026-11-03"
juridiction: CMR
mode_par_defaut_si_incertain: BLOQUER   # Principe III

autorisation_prealable:                      # art. 19 [fait, texte officiel relu]
  traitement_donnees_personnelles:           # al. 1 : TOUT traitement
    autorisation_apdp_obtenue: false
    reference_autorisation: null
    sources: [CMR-LOI-2024-017::0020]
    lacune: L12
  interconnexion_interoperabilite:           # al. 2 : fichiers de données sensibles / relatives aux mineurs
    autorisation_apdp_obtenue: false
    lecture: large                           # données sensibles ET données relatives aux mineurs (virgule ambiguë)
    sources: [CMR-LOI-2024-017::0020]
    lacune: L12
  # Mode de fonctionnement déduit (spec 007, FR-714) :
  #   demo_synthetique        -> toujours permis (aucune donnée personnelle réelle)
  #   sans_donnees_personnelles -> permis : recherches anonymes sans compte, triage sur l'appareil, aucun journal identifiant
  #   complet                 -> exige autorisation_apdp_obtenue: true et une reference_autorisation
  mode_production_si_pas_autorisation: sans_donnees_personnelles

numeros_urgence:
  - {valeur: "119", libelle: "Assistance médicale (SAMU)", statut: source_officielle_etrangere, source: "https://voyage.gc.ca/assistance/ambassades-consulats/cameroun (consulté le 2026-11-03)"}
  - {valeur: "112", libelle: "Urgences", statut: source_secondaire, source: "encyclopédie en ligne, à recouper avec une source camerounaise"}
  - {valeur: "111", libelle: "Indiqué par l'équipe", statut: a_confirmer, source: null}
  - {valeur: "1510", libelle: "Ligne verte MINSANTE (signalement d'événements de santé)", statut: source_officielle_kb, source: "CMR-MINSANTE-GUIDE-SBC-2023"}

triage:
  validation_clinique_obtenue: false
  validateur_clinique: null
  usage_autorise_sans_validation: [demo_synthetique]
  mention_demo: "Règles issues de la PCIME (OMS), non validées cliniquement pour le Cameroun"
  lacune: V7

etat_institutionnel:
  apdp_operationnelle:
    valeur: false
    statut: hypothese
    note: "Autorité créée par la loi 2024/017 ; décret d'organisation non identifié dans les sources réunies."
    sources: [CMR-LOI-2024-017::0033]
    lacune: L3
  decret_transfert_publie:          # art. 32 al. 3
    valeur: false
    statut: hypothese
    sources: [CMR-LOI-2024-017::0033]
    lacune: L3
  decret_analyse_impact_publie:     # art. 33
    valeur: false
    statut: hypothese
    sources: [CMR-LOI-2024-017::0034]
    lacune: L3
  texte_sectoriel_sante_publie:     # art. 72
    valeur: false
    statut: hypothese
    sources: [CMR-LOI-2024-017::0068]
    lacune: L2
  conditions_publicite_art19_publiees:
    valeur: false
    statut: hypothese
    sources: [CMR-LOI-90-035::0017]
    lacune: L8
  registre_ouvert_pharmacies:
    valeur: false
    statut: hypothese
    lacune: L9
  cadre_partage_app_simr:
    valeur: false
    statut: hypothese
    sources: [CMR-MINSANTE-GUIDE-SBC-2023::0018]
    lacune: L4

consentement:
  orientation:
    base: consentement_expres     # art. 9 al. 1 ; exprès car données de santé sensibles (art. 5, art. 66 al. 1)
    granularite: specifique       # un consentement par finalité
    sources: [CMR-LOI-2024-017::0011]
  urgence_vitale:
    base: preservation_sante      # art. 9 al. 2 — affichage de l'orientation urgente même sans consentement
    execution: sur_appareil       # sans consentement exprès, les symptômes ne quittent pas l'appareil (art. 66 al. 1)
    actions_autorisees: [afficher_orientation_urgente, afficher_bandeau_urgence]
    actions_interdites: [journaliser_symptomes_nominatifs, partager_surveillance]
    statut: choix_equipe
    sources: [CMR-LOI-2024-017::0011]
  surveillance:
    base: consentement_expres_separe     # case distincte, refus sans effet sur l'orientation
    alternative_si_cadre_publie: mission_interet_public
    statut: choix_equipe
    sources: [CMR-LOI-2024-017::0011]
    lacune: L4
  geolocalisation:
    base: consentement
    precision_max_decimales: 2
    alternative_sans_consentement: saisie_manuelle_quartier
    sources: [CMR-LOI-2024-017::0011]
  mineur:
    age_majorite: 18
    exige: consentement_parent_ou_representant
    sans_consentement_parental: [orientation_urgente_seulement]
    sources: [CMR-LOI-2024-017::0011]

decision_automatisee:
  orientation_est_decision_exclusivement_automatisee:
    valeur: true
    statut: choix_equipe          # interprétation prudente
    sources: [CMR-LOI-2024-017::0044]
  droits_affiches: [intervention_humaine, exprimer_point_de_vue, contester]
  profilage:
    autorise: false
    statut: choix_equipe          # parade à L1 : on n'en fait pas
    sources: [CMR-LOI-2024-017::0044, CMR-LOI-2024-017::0062]
    lacune: L1

donnees_sensibles:
  # Art. 5 : la santé est une donnée sensible. Art. 66 al. 1 : mettre ou conserver en mémoire une donnée
  # sensible sans consentement exprès est puni. Art. 48 : certaines catégories sont interdites,
  # sans dérogation prévue dans l'article lui-même.
  sante:
    categorie: sensible                      # art. 5 [fait]
    exige: consentement_expres               # art. 66 al. 1 [fait] — case dédiée, jamais implicite
    consentement_suffisant: false            # condition nécessaire, pas suffisante (note du juriste, docs/note-interpretation-donnees-sensibles.md)
    sources: [CMR-LOI-2024-017::0005, CMR-LOI-2024-017::0062]
  categories_interdites_art48:               # art. 48 al. 1 [fait, texte officiel relu]
    valeur: [opinions_religieuses_philosophiques_politiques_syndicales, origine_raciale_ethnique,
             origine_linguistique_regionale, vie_sexuelle, genetique_sante, biometrie_sante]
    derogation_par_consentement: false       # aucune dérogation dans l'article [fait] ; art. 66 ne déroge pas à l'art. 48
    statut_interpretation: position_conservatoire_juriste_equipe   # 2026-11-03, à confirmer avant production
    modifiable_en_simulation: true           # pour simuler un futur texte d'application
    sources: [CMR-LOI-2024-017::0048]
    lacune: L11
  # Interprétations prudentes de l'équipe (à faire valider) :
  revele_vie_sexuelle:
    statut: choix_equipe
    recherches: [planification_familiale, contraception, infectiologie_vih, antiretroviraux, gynecologie_obstetrique]
    traitement: recherche_sur_appareil       # le serveur ne reçoit jamais la requête (spec 004, FR-408)
  donnees_genetiques_exclues:
    statut: choix_equipe
    exemples: [genotype_drepanocytose, antecedents_genetiques_familiaux, resultat_test_genetique]
    traitement: ne_jamais_demander           # spec 001, FR-111
  biometrie_exclue:
    statut: choix_equipe
    exemples: [empreinte, reconnaissance_faciale, empreinte_vocale, photo_lesion_identifiante]
    traitement: aucune_collecte_serveur      # déverrouillage biométrique géré par le système de l'appareil uniquement
  langue:
    statut: choix_equipe
    traitement: preference_interface_sur_appareil   # jamais journalisée, jamais déduite comme « origine »
  recherches_sensibles_specialite: [psychiatrie, oncologie, infectiologie_vih, addictologie, gynecologie_obstetrique, planification_familiale]
  classes_medicament_sensibles: [antiretroviraux, contraception, psychotropes, antituberculeux]
  traitement: [pas_de_journal_nominatif, agregat_seulement, pas_de_historique_compte]
  produits_exclus_art75: true
  sources: [CMR-LOI-2024-017::0005, CMR-LOI-2024-017::0011, CMR-LOI-2024-017::0048, CMR-LOI-90-035::0072]

transactions_bancaires:                      # art. 48 al. 2
  paiement_dans_application: false           # aucun paiement (ni patient ni pharmacie) ; sinon autorisation préalable requise
  sources: [CMR-LOI-2024-017::0048]

transfert_hors_pays:
  autorise_donnees_personnelles: false     # bascule à true si decret_transfert_publie ET autorisation APDP
  autorise_donnees_anonymisees: true
  autorise_donnees_synthetiques: true
  repli: [modele_local, anonymisation, refus]
  sources: [CMR-LOI-2024-017::0033, CMR-MINSANTE-PSNSN-2026-2030::0005]
  lacune: L3

surveillance:
  seuil_minimal_cas_par_zone: 5         # confirmé par l'équipe le 2026-11-03
  maille_spatiale: aire_de_sante
  maille_temporelle: semaine_epi
  decalage_publication_jours: 7         # confirmé par l'équipe le 2026-11-03
  transfrontalier: hors_perimetre_prototype
  validation_humaine_obligatoire: true
  acces_detail: [point_focal_district]
  acces_public: carte_agregee
  localisation_individuelle_partageable: false
  delais_heures: {notification: 24, triage: 24, evaluation_risque: 48}
  sources: [CMR-MINSANTE-GUIDE-SBC-2023::0028, CMR-MINSANTE-GUIDE-SBC-2023::0018, INT-OMS-RSI-2005-AMENDE-2022::0012, INT-OMS-RSI-2005-AMENDE-2022::0054]
  lacunes: [L4, L6]

pharmacie:
  declarants_autorises_medicament: [officine_agreee, pharmacie_hospitaliere]
  declarants_autorises_sang: [banque_de_sang_hospitaliere, centre_transfusion]
  classement_payant: false
  interdits: [suggerer_alternative, indiquer_posologie, promouvoir_produit, classement_payant]
  mention_obligatoire: "Délivré sur ordonnance"
  sources: [CMR-LOI-90-035::0017, CMR-LOI-90-035::0049, CMR-LOI-90-035::0012]
  lacunes: [L8, L9]

notation_etablissements:
  publication_score: true
  delai_contestation_jours: 7            # décision de l'équipe, 2026-11-03
  delai_reponse_moderateur_heures: 72
  rafale_fondee_application: progressive
  rafale_fondee_etalement_jours: 7       # PROPOSITION À APPROUVER
  gel_si_rafale: true
  moderation_humaine: true
  statut: choix_equipe
  lacune: L10

journal_audit:
  ajout_seul: true
  chainage: sha256
  conservation_jours: 365        # choix équipe ; art. 29 loi 2010/012 (10 ans, données de trafic) — applicabilité à vérifier
  champs_interdits: [nom, telephone, position_precise, texte_libre_symptomes, langue, requete_revelant_vie_sexuelle, donnee_genetique, donnee_biometrique]
  sources: [CMR-LOI-2010-012::0034, INT-UE-AI-ACT-2024-1689::0032]

llm:
  hebergement: local             # Ollama
  usage_autorise: [reformulation, detection_langue, extraction_symptomes_vers_codes]
  usage_interdit: [diagnostic, prescription, abaisser_niveau_urgence, decision_conformite_sans_citation]
  sources: [INT-OMS-LMM-2024::0007]

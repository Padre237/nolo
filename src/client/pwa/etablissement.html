<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace établissement · Facility area</title>
<style>
  :root { --bleu:#0a5ea8; --bleu-clair:#e8f1fb; --texte:#1d2733; --gris:#5b6675; --bord:#cfd8e3;
          --rouge:#b42318; --rouge-clair:#fdecea; --vert:#1a7f37; --vert-clair:#e6f4ea; --jaune:#fff3c4; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--texte); background:#f6f8fb; }
  header.barre { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px; background:#fff; border-bottom:1px solid var(--bord); }
  header.barre strong { font-size:16px; }
  .demo { background:var(--jaune); font-size:14px; padding:6px 16px; border-bottom:1px solid #e6c84f; }
  .langues { display:flex; gap:6px; }
  .langues button, .onglets button, nav.vues button { font:inherit; font-size:14px; padding:6px 12px; border:1px solid var(--bleu); background:#fff; color:var(--bleu); border-radius:6px; cursor:pointer; }
  .langues button[aria-pressed="true"], .onglets button[aria-selected="true"], nav.vues button[aria-current="page"] { background:var(--bleu); color:#fff; }
  main { max-width:820px; margin:0 auto; padding:16px 16px 48px; }
  h1 { font-size:24px; margin:4px 0 12px; } h2 { font-size:20px; margin:20px 0 8px; } h3 { font-size:17px; margin:18px 0 6px; color:var(--bleu); }
  .carte { background:#fff; border:1px solid var(--bord); border-radius:10px; padding:16px; margin-bottom:14px; }
  .onglets, nav.vues { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  label.champ { display:block; font-weight:600; margin:12px 0 4px; }
  .aide { font-size:14px; color:var(--gris); margin:2px 0 0; }
  input[type=text], input[type=email], input[type=password], input[type=tel], input[type=number], select { font:inherit; width:100%; padding:10px; border:1px solid var(--bord); border-radius:8px; background:#fff; }
  .ligne { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  fieldset { border:1px solid var(--bord); border-radius:8px; margin:12px 0 0; padding:8px 12px 12px; }
  legend { font-weight:600; padding:0 4px; }
  .choix { display:flex; flex-wrap:wrap; gap:6px 16px; }
  .choix label { display:flex; gap:6px; align-items:center; font-weight:400; }
  .choix input { width:20px; height:20px; accent-color:var(--bleu); }
  label.case { display:flex; gap:10px; align-items:flex-start; margin-top:12px; }
  label.case input { width:22px; height:22px; flex:none; accent-color:var(--bleu); }
  .horaires { display:grid; grid-template-columns:minmax(0,1fr) 6.5rem 6.5rem; gap:6px 8px; align-items:center; }
  .horaires select { padding:8px 4px; min-width:0; }
  .defilement { overflow-x:auto; }
  button.principal, button.secondaire, a.bouton { font:inherit; font-weight:600; padding:12px 16px; border-radius:8px; cursor:pointer; display:inline-block; text-decoration:none; }
  button.principal { background:var(--bleu); color:#fff; border:2px solid var(--bleu); }
  button.secondaire, a.bouton { background:#fff; color:var(--bleu); border:2px solid var(--bleu); }
  button.danger { background:#fff; color:var(--rouge); border:2px solid var(--rouge); font:inherit; font-weight:600; padding:12px 16px; border-radius:8px; cursor:pointer; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .message { padding:10px 12px; border-radius:8px; margin:10px 0; }
  .message.erreur { background:var(--rouge-clair); color:#7a1610; } .message.ok { background:var(--vert-clair); color:#0f5323; } .message.info { background:var(--bleu-clair); }
  .message.attention { background:var(--jaune); }
  .err-champ { color:var(--rouge); font-size:14px; font-weight:600; margin-top:4px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:14px; font-weight:600; }
  .badge.VERIFIE { background:var(--vert-clair); color:var(--vert); } .badge.EN_ATTENTE_VERIFICATION, .badge.FICHE_INCOMPLETE { background:var(--jaune); color:#6b5300; } .badge.REFUSE { background:var(--rouge-clair); color:var(--rouge); }
  table { width:100%; border-collapse:collapse; font-size:15px; margin-top:8px; }
  th, td { border:1px solid var(--bord); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:var(--bleu-clair); }
  ol.etapes { padding-left:20px; } ol.etapes li { margin:4px 0; } ol.etapes li.fait::marker { color:var(--vert); }
  .photos { display:flex; flex-wrap:wrap; gap:12px; } .photos figure { margin:0; width:160px; } .photos img { width:160px; height:110px; object-fit:cover; border-radius:8px; border:1px solid var(--bord); }
  .photos figcaption { font-size:14px; display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:4px; }
  .photos figcaption button { font:inherit; font-size:13px; border:1px solid var(--rouge); color:var(--rouge); background:#fff; border-radius:6px; padding:2px 8px; cursor:pointer; }
  ul.historique { list-style:none; padding:0; } ul.historique li { padding:6px 0; border-bottom:1px solid var(--bord); } ul.historique time { color:var(--gris); font-size:14px; display:block; }
  .tuiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
  .tuile { background:#fff; border:1px solid var(--bord); border-radius:10px; padding:12px; }
  .tuile .etiquette { font-size:14px; color:var(--gris); } .tuile .valeur { font-size:24px; font-weight:700; margin:2px 0; } .tuile .detail { font-size:13px; color:var(--gris); }
  .filtres { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; align-items:end; }
  .filtres label { font-size:14px; font-weight:600; display:block; margin-bottom:2px; }
  .filtres select { padding:8px; }
  .note { font-size:13px; color:var(--gris); margin:6px 0 0; }
  .rang { display:grid; grid-template-columns:minmax(0,9rem) 1fr auto; gap:4px 8px; align-items:center; }
  .rang button.lien { font:inherit; font-size:14px; background:none; border:none; color:var(--texte); text-align:left; cursor:pointer; padding:4px 0; text-decoration:underline dotted; }
  .rang button.lien[aria-pressed="true"] { font-weight:700; color:var(--bleu); }
  .rang .piste { height:14px; background:#eef1f5; border-radius:2px; }
  .rang .barre { height:14px; background:#2a78d6; border-radius:0 4px 4px 0; }
  .rang .chiffre { font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .fleche { font-size:12px; color:var(--gris); margin-left:4px; }
  svg.graphique, svg.carte { width:100%; height:auto; display:block; }
  .legende { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; margin-top:6px; }
  .legende span.puce { display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:4px; border:1px solid #c5ccd6; }
  #infobulle { position:fixed; pointer-events:none; background:#1d2733; color:#fff; font-size:13px; padding:6px 8px; border-radius:6px; z-index:10; max-width:240px; }
  .attribution { font-size:12px; color:var(--gris); text-align:right; margin-top:4px; } .attribution a { color:var(--gris); }
  @media (max-width:560px) { .ligne { grid-template-columns:1fr; } }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header class="barre">
  <strong id="titre-app"></strong>
  <div class="langues" role="group" id="langues">
    <button type="button" data-langue="fr">Français</button>
    <button type="button" data-langue="en">English</button>
  </div>
</header>
<div class="demo" id="bandeau-demo"></div>
<main id="principal" aria-live="polite"></main>
<div id="infobulle" role="tooltip" hidden></div>
<script type="module" src="./js/etablissement.mjs"></script>
</body>
</html>

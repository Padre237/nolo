    decision: D-024
    note: >-
      Corrections de cohérence relevées en rédigeant SF-001-03 (aucun code existant modifié) :
      (1) quatre expressions ambiguës rendues univoques (souffle court, ne mange plus, cannot breastfeed, cannot drink) ;
      (2) mots trop généraux retirés car ils déclenchaient une urgence hors contexte : « bleu » (ecchymose → cyanose),
      « blanc », « chute » (chute de cheveux), « coup » (tout d'un coup), « fall » (fall asleep), « fits » (fit),
      « contractions » (contractions musculaires → accouchement et grossesse), « morsure » seul ; « épuisé » déplacé de
      l'altération de l'état général vers la fatigue ;
      (3) « ne tète plus » rattaché à « incapable de boire ou de téter » comme « ne tète pas » ;
      (4) implication ajoutée : etat_conscience_altere → confusion_somnolence_agitation (définition IITT p. 2 :
      « État de conscience altéré (confusion, agitation, irritabilité permanente ou léthargie) »), sans laquelle ce signe de
      détresse respiratoire de l'adulte était inaccessible depuis la liste fermée ;
      (5) entrée dérivée ajoutée en fin de liste : SYM-110 diarrhee_avec_sang (non affichée, implique diarrhee et
      sang_dans_selles ; source INT-OMS-PCIME-MANUEL::0042) pour que « diarrhée avec du sang » satisfasse la règle PCIME-J-02 ;
      (6) termes principaux et variantes courantes ajoutés comme synonymes (inconscient, confus, difficulté à respirer,
      raideur de la nuque, respire vite, rhume, brûlure au visage, brûlure étendue, brûlure par inhalation, plaie pénétrante,
      morsure d'animal, respire en forçant, blessure, diarrhea, watery stools, very thin…).

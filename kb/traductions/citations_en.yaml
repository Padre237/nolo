# Traductions anglaises des fragments cités par la démonstration (D-027).
# Règles :
#  - le texte officiel en français reste la seule référence ; une traduction « non_officielle » ne le remplace jamais
#    et s'affiche toujours avec la mention ci-dessous ;
#  - chaque entrée est liée à l'empreinte SHA-256 du champ `text` du fragment dans kb_chunks.jsonl :
#    si le fragment change (relecture, correction), le contrôle échoue et la traduction doit être revue ;
#  - portée « integrale » : tout le fragment ; « extrait » : seuls les passages listés, recopiés mot pour mot du fragment
#    (erreurs de reconnaissance de texte comprises), sont traduits ;
#  - entre crochets [ ] : note du traducteur (passage illisible, mot reconstitué, tampon non traduit) ;
#  - textes internationaux dont la version anglaise officielle est connue (OMS, UE) : on ne traduit pas, on la verse dans
#    la base (statut « version_anglaise_officielle_a_verser ») ;
#  - textes camerounais : la traduction non officielle est provisoire ; quand une version anglaise officielle est repérée,
#    le champ `version_anglaise_officielle` l'indique, et elle remplacera la traduction dès qu'elle sera versée dans la base.
# Contrôle : python3 traductions/verifier_traductions.py (depuis le dossier kb/).
version: "1.1.0"   # 1.1.0 : 8 fragments de la loi 2019/019 reliés à sa version anglaise officielle
date: "2026-11-07"
statut: UNDER_REVIEW
traducteur: "Claude (assistant IA), à relire par un membre bilingue de l'équipe"
mention_non_officielle: "Unofficial translation, for information only. The French text is the only authentic version used by this system."
statuts_admis: [non_officielle, anglais_officiel_dans_la_source, original_anglais, version_anglaise_officielle_a_verser, anglais_officiel_dans_la_base]
# anglais_officiel_dans_la_base : la version anglaise officielle du texte est versée ; `chunk_id_en` désigne le fragment
# anglais correspondant, affiché à la place de toute traduction (ajouté le 2026-11-07, loi 2019/019).

entrees:

  - chunk_id: CMR-LOI-2024-017::0011
    reference_en: "Law No. 2024/017 of 23 December 2024, Section 9"
    statut_traduction: non_officielle
    version_anglaise_officielle: "Law No. 2024/017 of 23 December 2024, English version on prc.cm (signalée par la note de collecte du 2026-11-06 ; à verser, remplacera cette traduction)"
    portee: integrale
    qualite_source: ocr_abime
    empreinte_sha256_fragment: "5e584c19d2fb34540f23d7679499eb3e2928ec689b534a666cfd79b96272a24f"
    relu_par: null
    traduction_en: >-
      SECTION 9.- (1) The processing of personal data shall be subject to the prior, free, informed, specific and
      unambiguous consent of the data subject. (2) However, this requirement of prior consent may be waived where the
      processing is necessary: - for compliance with a legal obligation to which the controller is subject; - for the
      performance of a task carried out in the public interest or falling within the exercise of [text garbled in the
      OCR source: « l'Autorité de protection des données à caractère perso »] vested in the controller or in the third
      party to whom [the data are] disclosed; - for the protection of the health of the data subject [end of line
      illegible in the OCR source] natural person. (3) The consent of a minor [under] eighteen (18) years of age shall
      be valid only if it is supported by that of [his or her father,] mother or legal representative [partly
      illegible in the OCR source].

  - chunk_id: CMR-LOI-2024-017::0020
    reference_en: "Law No. 2024/017 of 23 December 2024, Section 19"
    statut_traduction: non_officielle
    version_anglaise_officielle: "Law No. 2024/017 of 23 December 2024, English version on prc.cm (signalée par la note de collecte du 2026-11-06 ; à verser, remplacera cette traduction)"
    portee: integrale
    qualite_source: relu_sur_texte_officiel
    empreinte_sha256_fragment: "e275aaa2d25e38af603ba4aeb5d14cb63df6512b10ecfb76abfd07af8b3e463a"
    relu_par: null
    traduction_en: >-
      SECTION 19.- (1) The processing of personal data shall be subject to obtaining prior authorisation issued by
      the Personal Data Protection Authority. (2) Any process of interconnection and interoperability of files of
      sensitive data, relating to minors, shall be subject to obtaining prior authorisation issued by the Personal
      Data Protection Authority. [The comma after « sensibles » is in the French text; the team reads subsection 2
      broadly, see point V5 of the gap register.] (3) The terms and conditions for issuing the authorisation referred
      to in subsections 1 and 2 above shall be laid down by regulation.

  - chunk_id: CMR-LOI-2024-017::0033
    reference_en: "Law No. 2024/017 of 23 December 2024, Section 32"
    statut_traduction: non_officielle
    version_anglaise_officielle: "Law No. 2024/017 of 23 December 2024, English version on prc.cm (signalée par la note de collecte du 2026-11-06 ; à verser, remplacera cette traduction)"

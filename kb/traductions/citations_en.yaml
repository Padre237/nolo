    relu_par: null
    traduction_en: >-
      SECTION 32.- (1) The transfer of [personal] da[ta to a] foreign [State], or to an internat[ional]
      organisation, [is subject to obtaining] a prior authorisation issued [by the Auth]ority for the protection of
      personal data under conditions making it possible to guarantee the exercise of [the rights — the rest of the
      subsection is garbled in the OCR source; the bracketed words are reconstructed from scattered pieces of the
      OCR text and must be checked against the official text]. (2) [Before issuing] the said authorisation, the
      [Personal Data Protection] Authority shall first ensure: - [the prior entry into force] of a legal instrument
      signed with the [State of] destination of the transferred personal data, [...] with the competent
      administrations and bodies; - that the entity seeking to import the personal data is subject to binding
      security rules on the protection of the said data; - that the importing and exporting entities concerned have
      previously subscribed to standard contractual clauses on the international transfer of personal data, issued
      and published by the Personal Data Protection Authority. [Stamp of the certified true copy, not translated.]
      (3) The terms and conditions for issuing the authorisation provided for in subsection 1 above shall be laid
      down by regulation.

  - chunk_id: CMR-LOI-2024-017::0034
    reference_en: "Law No. 2024/017 of 23 December 2024, Section 33"
    statut_traduction: non_officielle
    version_anglaise_officielle: "Law No. 2024/017 of 23 December 2024, English version on prc.cm (signalée par la note de collecte du 2026-11-06 ; à verser, remplacera cette traduction)"
    portee: integrale

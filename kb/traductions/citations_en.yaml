    relu_par: null
    traduction_en: >-
      SECTION 33.- (1) Any type of processing likely to result in a high risk to the rights and freedoms of natural
      persons shall be subject to the prior carrying out of an assessment of the impact of the envisaged processing
      operations on the protection of personal data. (2) The conditions and terms for carrying out the impact
      assessment referred to in subsection 1 above shall be laid down by regulation.

  - chunk_id: CMR-LOI-2024-017::0044
    reference_en: "Law No. 2024/017 of 23 December 2024, Section 44"
    statut_traduction: non_officielle
    version_anglaise_officielle: "Law No. 2024/017 of 23 December 2024, English version on prc.cm (signalée par la note de collecte du 2026-11-06 ; à verser, remplacera cette traduction)"
    portee: integrale

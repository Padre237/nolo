    traduction_en: >-
      Section 13.- The following shall be reserved to pharmacists: a) the preparation of: articles and medicines
      intended for use in human medicine; dressing materials [and … — illegible in the OCR source] presented as
      conforming to the pharmacopoeia; insecticides and acaricides intended to be applied to humans; products intended
      for the maintenance or application of contact lenses; products and reagents packaged for sale to the public
      which, without being covered by Section 15 below, are nevertheless intended for medical diagnosis; b) wholesale,
      retail sale and any supply to the public of the products and articles listed in the preceding paragraph; c) the
      sale of medicinal plants listed in the pharmacopoeia; d) the importation, holding and commercial exploitation
      of all the products referred to in this Section. [The fragment continues with Section 14, whose heading is
      badly recognised:] Section 14.- The preparation and supply of vaccines, sera and allergens, where they are
      specially prepared for a single individual, may be carried out by any person approved by the authority
      responsible for public health.

  - chunk_id: CMR-LOI-90-035::0013
    reference_en: "Law No. 90/035 of 10 August 1990 (pharmacist profession), Section 15"
    statut_traduction: non_officielle
    portee: integrale
    qualite_source: lisible
    empreinte_sha256_fragment: "d8fcb934975e227e3e576543df3bf46fb76ea356b3988e06be9e624c8b66dfca"
    relu_par: null
    traduction_en: >-
      Section 15.- (1) A medicine shall mean any substance or composition presented as having curative or preventive
      properties with regard to human or animal diseases, as well as any product that may be administered to humans
      or animals with a view to making a medical diagnosis or to restoring, correcting or modifying their organic
      functions. (2) The following shall in particular be considered as medicines: products containing a substance
      having a therapeutic action within the meaning of subsection 1 above or containing poisonous substances at
      non-exempted doses and concentrations; dietetic products which contain in their composition chemical or
      biological substances that do not themselves constitute foods, but whose presence gives these products either
      special properties sought in dietetic therapy or the properties of test meals. (3) Products used for
      disinfecting premises and for dental prostheses shall not be considered as medicines.


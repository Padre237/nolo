    relu_par: null
    traduction_en: >-
      SECTION 48.- (1) It shall be prohibited to carry out any processing of data relating to religious,
      philosophical, political or trade-union opinions and activities, to racial or ethnic, linguistic or regional
      origin, to sexual life, to genetics and to biometrics in matters of health. (2) It shall be prohibited to
      process personal data in the context of banking transactions without the prior authorisation of the competent
      administrations and bodies, under the conditions and in accordance with the procedures laid down by the laws
      in force.


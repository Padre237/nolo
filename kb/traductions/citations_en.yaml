    relu_par: null
    traduction_en: >-
      SECTION 44.- (1) The data subject shall have the right to object to any decision based solely on the automated
      processing of his or her personal data, including profiling. (2) The provisions of subsection 1 above shall not
      apply where: [stamp of the certified true copy, not translated] - the data subject has been informed of the use
      of the automated decision-making system and has given his or her prior, explicit and informed consent; - the
      processing is authorised by law, provided that the law lays down appropriate measures to safeguard the rights
      and freedoms and the legitimate interests of the data subject. (3) The data subject shall also have the right:
      - to obtain human intervention on the part of the [controller — partly illegible in the OCR source]; - to
      express his or her point of view; - to contest the decision based on the [automated] process[ing — the end of
      the subsection is cut off in this fragment].

  - chunk_id: CMR-LOI-2024-017::0048
    reference_en: "Law No. 2024/017 of 23 December 2024, Section 48"
    statut_traduction: non_officielle
    version_anglaise_officielle: "Law No. 2024/017 of 23 December 2024, English version on prc.cm (signalée par la note de collecte du 2026-11-06 ; à verser, remplacera cette traduction)"

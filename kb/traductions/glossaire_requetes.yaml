# Glossaire de requêtes anglais → français (D-027).
# Usage prévu : une question posée en anglais à l'assistant « Mes droits santé » est complétée par les mots-clés
# français correspondants avant la recherche dans la base, dont les textes camerounais sont en français.
# Ce n'est PAS une traduction juridique : chaque ligne relie des mots courants à des termes qui figurent dans les
# fragments. Le contrôle vérifie que chaque terme français apparaît au moins une fois dans kb_chunks.jsonl.
# Correspondance : une entrée s'applique si l'une de ses expressions anglaises apparaît dans la question
# (minuscules, mots entiers) ; les termes français sont ajoutés à la requête, la question d'origine est conservée.
# État : données seulement ; la conversion des requêtes n'est pas implémentée (incrément 2, §7).
version: "1.2.0"   # 1.2.0 (2026-11-09) : champ `courant_fr` (expressions françaises courantes, même règle d'ajout ; SF-016-01, DES-016-01-03)

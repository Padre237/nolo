# Règles de triage, version 2 — STATUT : UNDER_REVIEW (proposition, non validée cliniquement).
# Sources : PCIME (OMS, 2001) et IITT (OMS, CICR, MSF), texte exact et fragments cités par règle.
# Remplacera kb/rules/triage_signes_alerte.yaml après approbation (SF-001-04 à SF-001-07). Généré le 2026-11-04.
schema: triage-regles/2
version: 2.0.0
statut: UNDER_REVIEW
date: '2026-11-04'
validateur_clinique: null
mention_demo: REGLES_PCIME_IITT_NON_VALIDEES_CAMEROUN
referentiel_symptomes: data/referentiels/symptomes.csv
decisions:
- D-006
- D-012
- D-018
- D-020
- D-021
- D-022
niveaux:
- urgence
- consultation_24h
- consultation_48h
- soins_courants
tranches_age:
- moins_8_jours
- 8_jours_2_mois
- 2_6_mois
- 6_mois_2_ans
- 2_5_ans
- 5_11_ans
- 12_17_ans
- 18_50_ans
- 51_70_ans
- plus_70_ans
parametres:
  risque_paludisme:
    valeur: eleve
    statut: hypothese
    dependance: DEP-005
correspondance:
  signe_general_danger:
    niveau: urgence
    priorite: immediate
    statut: PROPOSITION (D-021)
  rouge:
    niveau: urgence
    priorite: immediate
    statut: PROPOSITION (D-021)
  jaune:
    niveau: urgence
    priorite: rapide
    statut: PROPOSITION (D-021)
  jaune_pcime:
    niveau: consultation_24h
    statut: PROPOSITION (D-021)
  aucune_regle:
    niveau: consultation_48h
    statut: PROPOSITION (D-021)
    condition: au moins un symptôme saisi
semantique:
  monotonie: 'Chaque condition ne porte que sur la présence de jetons, de composites ou sur la tranche d''âge : ajouter un symptôme ne peut jamais
    abaisser le niveau (ADR-005).'
  niveau_retenu: Le plus élevé parmi les règles satisfaites (urgence > consultation_24h > consultation_48h > soins_courants) ; à niveau égal,
    priorité immediate > rapide.
  implications: Avant évaluation, les jetons sont complétés par la colonne « implique » du référentiel (fermeture transitive).
  operateurs:
    tous: tous présents
    au_moins_un: au moins un présent
    au_moins_n: au moins n parmi la liste
    tous_groupes: au moins un jeton de chaque groupe
    symptome_present: au moins un jeton saisi
    duree_jours_min: durée déclarée ≥ valeur
    parametre: paramètre de déploiement égal à la valeur
  sans_criteres_rouges: 'La mention « (sans critères rouges) » de l''IITT est satisfaite par construction : un critère rouge l''emporte toujours.'
exclusions:
- jeton: agression_sexuelle
  motif: Art. 48 de la loi 2024/017 (vie sexuelle) ; lecture conservatoire D-008
  lacune: L13
  fragments:
  - CMR-LOI-2024-017::0048
- jeton: priapisme
  motif: 'Rattachement possible à la vie sexuelle : exclu en attente de l''avis du juriste (D-022)'
  lacune: L13
  fragments:
  - CMR-LOI-2024-017::0048
- jeton: signes_vitaux_haut_risque
  motif: 'Étape 3 de l''IITT : mesures (FC, FR, température, SpO2, AVPU) impossibles sans appareil ; non utilisées en auto-orientation'
  lacune: L5
- jeton: violence_agressivite
  motif: Critère d'établissement (comportement au service des urgences), sans objet en auto-orientation
- jeton: pli_cutane_lent
  motif: Signe d'examen clinique ; la règle « 2 des signes » est appliquée sur les 3 signes observables
composites:
  hypothermie_ou_fievre:
    au_moins_un:
    - fievre
    note: 'hypothermie exclue : mesure de température nécessaire'
    texte_source:
    - hypothermie ou fièvre
    fragments:
    - INT-OMS-IITT-FR::0000
  detresse_respiratoire_adulte:
    tous:
    - difficulte_respiratoire
    au_moins_un:
    - respiration_tres_rapide_ou_lente
    - incapacite_parler_marcher
    - confusion_somnolence_agitation
    - muscles_accessoires
    texte_source:

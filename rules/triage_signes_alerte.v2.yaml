    fragments:
    - INT-OMS-IITT-FR::0003
  traumatisme_haut_risque_contexte:
    tous:
    - traumatisme
    au_moins_un:
    - sous_anticoagulants
    - grossesse
    texte_source:
    - Patient présentant un trouble de la coagulation ou sous anticoagulants
    - Grossesse
    fragments:
    - INT-OMS-IITT-FR::0003
  critere_rouge_grossesse:
    tous:
    - grossesse
    au_moins_un:
    - saignements_abondants
    - douleur_abdominale_severe
    - convulsions
    - etat_conscience_altere
    - cephalee_intense
    - troubles_visuels_aigus
    - accouchement_declenche
    - traumatisme
    texte_source:
    - 'GROSSESSE AVEC AU MOINS UN DES CRITÈRES SUIVANTS :'
    fragments:
    - INT-OMS-IITT-FR::0000
